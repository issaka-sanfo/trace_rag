spring:
  application:
    name: trace-rag-spring
  web:
    resources:
      cache:
        period: 1h

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

tracerag:
  version: 1.0.0
  provider: ${RAG_PROVIDER:local}
  min-retrieval-score: ${MIN_RETRIEVAL_SCORE:0.15}
  default-top-k: ${DEFAULT_TOP_K:4}
  max-query-chars: ${MAX_QUERY_CHARS:1000}
  max-document-chars: ${MAX_DOCUMENT_CHARS:50000}
  runtime-dir: ${RUNTIME_DIR:data/runtime}
  trace-path: ${TRACE_PATH:logs/traces.jsonl}
  admin-api-key: ${ADMIN_API_KEY:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    embedding-model: ${OLLAMA_EMBED_MODEL:embeddinggemma}
    chat-model: ${OLLAMA_CHAT_MODEL:gemma3:4b}
